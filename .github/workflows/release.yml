name: Build & release APK

# Build a signed APK and publish it as a GitHub Release whenever you push a tag
# like v1.0.0. Obtainium watches these releases and installs/updates the APK.
# You can also run it by hand from the Actions tab (workflow_dispatch).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Derive version
        id: ver
        run: |
          # v1.2.3 -> name "1.2.3"; versionCode from the run number (monotonic).
          NAME="${GITHUB_REF_NAME#v}"
          if [ -z "$NAME" ] || [ "$NAME" = "$GITHUB_REF_NAME" ]; then NAME="0.$GITHUB_RUN_NUMBER"; fi
          echo "name=$NAME"          >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APK_VERSION: ${{ steps.ver.outputs.name }}
          APK_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/PugetFlow-${{ steps.ver.outputs.name }}.apk"

      # Manual (workflow_dispatch) runs: just attach the APK as a build artifact.
      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: PugetFlow-apk
          path: out/*.apk

      # Tag pushes (v*): publish a GitHub Release that Obtainium can track.
      - name: Publish Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PugetFlow ${{ steps.ver.outputs.name }}
          files: out/*.apk
          generate_release_notes: true
